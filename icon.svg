<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="#1a1a2e"/>

  <!-- Colored border segments -->
  <!-- 0-25 min: red (0° to 150°, starting from 12 o'clock = -90° offset) -->
  <path d="M256,32 A224,224 0 0,1 450,368" fill="none" stroke="#e94560" stroke-width="32" stroke-linecap="butt"/>

  <!-- 25-30 min: green (150° to 180°) -->
  <path d="M450,368 A224,224 0 0,1 256,480" fill="none" stroke="#4ecca3" stroke-width="32" stroke-linecap="butt"/>

  <!-- 30-55 min: red (180° to 330°) -->
  <path d="M256,480 A224,224 0 0,1 62,144" fill="none" stroke="#e94560" stroke-width="32" stroke-linecap="butt"/>

  <!-- 55-60 min: green (330° to 360°) -->
  <path d="M62,144 A224,224 0 0,1 256,32" fill="none" stroke="#4ecca3" stroke-width="32" stroke-linecap="butt"/>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="180" fill="#16213e"/>

  <!-- Hour markers -->
  <g fill="#444">
    <circle cx="256" cy="92" r="8"/>
    <circle cx="338" cy="114" r="6"/>
    <circle cx="398" cy="174" r="6"/>
    <circle cx="420" cy="256" r="8"/>
    <circle cx="398" cy="338" r="6"/>
    <circle cx="338" cy="398" r="6"/>
    <circle cx="256" cy="420" r="8"/>
    <circle cx="174" cy="398" r="6"/>
    <circle cx="114" cy="338" r="6"/>
    <circle cx="92" cy="256" r="8"/>
    <circle cx="114" cy="174" r="6"/>
    <circle cx="174" cy="114" r="6"/>
  </g>

  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#eee" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="310" y2="180" stroke="#eee" stroke-width="6" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#eee"/>
</svg>

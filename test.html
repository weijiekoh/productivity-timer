<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #888;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 20px 40px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .work-btn {
            background: #e94560;
            color: white;
        }

        .rest-btn {
            background: #4ecca3;
            color: white;
        }

        .description {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .sound-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sound Test</h1>
        <p>Click the buttons to preview notification sounds</p>

        <div class="buttons">
            <div class="sound-card">
                <button class="work-btn" onclick="playWorkEndSound()">
                    Work End Sound
                </button>
                <span class="description">Soothing "dum-da"</span>
            </div>

            <div class="sound-card">
                <button class="rest-btn" onclick="playRestEndSound()">
                    Rest End Sound
                </button>
                <span class="description">Uplifting "da-ding"</span>
            </div>
        </div>
    </div>

    <script src="sounds.js"></script>
</body>
</html>

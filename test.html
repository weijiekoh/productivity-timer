<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button, input {
            font-family: inherit;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #888;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 20px 40px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .work-btn {
            background: #e94560;
            color: white;
        }

        .rest-btn {
            background: #4ecca3;
            color: white;
        }

        .description {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .sound-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .og-preview {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #333;
        }

        .og-preview h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .og-preview p {
            margin-bottom: 20px;
        }

        .og-image {
            max-width: 600px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sound Test</h1>
        <p>Click the buttons to preview notification sounds</p>

        <div class="buttons">
            <div class="sound-card">
                <button class="work-btn" onclick="playWorkEndSound()">
                    Work End Sound
                </button>
                <span class="description">Soothing "dum-da"</span>
            </div>

            <div class="sound-card">
                <button class="rest-btn" onclick="playRestEndSound()">
                    Rest End Sound
                </button>
                <span class="description">Uplifting "da-ding"</span>
            </div>
        </div>

        <div class="og-preview">
            <h2>OpenGraph Preview Image</h2>
            <p>1200x630 - Used for social media sharing</p>
            <img src="og-image.svg" alt="OpenGraph preview image" class="og-image">
        </div>
    </div>

    <script src="sounds.js"></script>
</body>
</html>

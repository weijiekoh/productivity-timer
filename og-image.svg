<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Timer display card -->
  <rect x="350" y="180" width="500" height="200" rx="16" fill="#16213e" stroke="#0f3460" stroke-width="3"/>

  <!-- Phase indicator -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" letter-spacing="3" fill="#e94560">WORK</text>

  <!-- Timer display -->
  <text x="600" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="90" font-weight="bold" letter-spacing="6" fill="#eeeeee">25:00</text>

  <!-- App title -->
  <text x="600" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#888888">Productivity Timer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Timer display card -->
  <rect x="350" y="180" width="500" height="200" rx="16" fill="#16213e" stroke="#0f3460" stroke-width="3"/>

  <!-- Phase indicator -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" letter-spacing="3" fill="#e94560">WORK</text>

  <!-- Timer display -->
  <text x="600" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="90" font-weight="bold" letter-spacing="6" fill="#eeeeee">25:00</text>

  <!-- Progress circles - work sessions -->
  <g transform="translate(600, 420)">
    <circle cx="-60" cy="0" r="10" fill="#e94560"/>
    <circle cx="-20" cy="0" r="10" fill="#e94560"/>
    <circle cx="20" cy="0" r="10" fill="#e94560"/>
    <circle cx="60" cy="0" r="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  </g>

  <!-- App title -->
  <text x="600" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#888888">Productivity Timer</text>

  <!-- Decorative elements - work/rest cycle indicator -->
  <g transform="translate(180, 315)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#e94560" stroke-width="4" stroke-dasharray="125.6 125.6" stroke-dashoffset="0"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#4ecca3" stroke-width="4" stroke-dasharray="125.6 125.6" stroke-dashoffset="-125.6"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#888">W</text>
  </g>

  <g transform="translate(1020, 315)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#4ecca3" stroke-width="4" stroke-dasharray="125.6 125.6" stroke-dashoffset="0"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#e94560" stroke-width="4" stroke-dasharray="125.6 125.6" stroke-dashoffset="-125.6"/>
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#888">R</text>
  </g>
</svg>

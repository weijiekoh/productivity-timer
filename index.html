<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Productivity Timer</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Theme color -->
    <meta name="theme-color" content="#1a1a2e">

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Productivity Timer">
    <link rel="apple-touch-icon" href="icon-180.png">

    <!-- OpenGraph -->
    <meta property="og:title" content="Productivity Timer">
    <meta property="og:description" content="A simple work/rest timer to boost your productivity">
    <meta property="og:image" content="og-image.svg">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        button {
            font-family: inherit;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            color: #eee;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 40px;
        }

        .timer-display {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 30px 60px;
            margin-bottom: 30px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }

            .timer-display {
                padding: 30px 20px;
            }
        }

        .phase-indicator {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #888;
        }

        .phase-indicator.work {
            color: #e94560;
        }

        .phase-indicator.rest {
            color: #4ecca3;
        }

        .time {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .controls {
            margin-bottom: 30px;
        }

        .start-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .start-btn:hover {
            background: #ff6b6b;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .start-btn.running {
            background: #4ecca3;
        }

        .start-btn.running:hover {
            background: #6ee6b8;
        }

        .quote {
            margin: 0 auto;
            max-width: 400px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s, transform 0.1s;
        }

        .quote:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .quote:active {
            transform: scale(0.98);
        }

        .quote:focus-visible {
            outline: 2px solid #4ecca3;
            outline-offset: 2px;
        }

        .quote-text,
        .quote-author {
            transition: opacity 0.2s;
        }

        .quote.changing .quote-text,
        .quote.changing .quote-author {
            opacity: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .quote,
            .quote-text,
            .quote-author {
                transition: none;
            }
        }

        .quote-text {
            font-style: italic;
            color: #aaa;
            font-size: 16px;
            line-height: 1.5;
        }

        .quote-author {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
        }

        /* Hide UI during work phase */
        body.working .controls {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-display">
            <div class="phase-indicator" id="phaseIndicator">Work</div>
            <div class="time" id="timerDisplay">25:00</div>
        </div>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start</button>
        </div>

        <div class="quote" id="quote" role="button" tabindex="0" aria-label="Show another quote">
            <div class="quote-text" id="quoteText" aria-live="polite">"The secret of getting ahead is getting started."</div>
            <div class="quote-author" id="quoteAuthor">— Mark Twain</div>
        </div>
    </div>

    <script src="sounds.js"></script>
    <script src="quotes.js"></script>
    <script src="app.js"></script>
    <script>showRandomQuote();</script>
</body>
</html>
